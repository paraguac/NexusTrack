server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexustrack}
spring.datasource.username=${DATABASE_USER:nexustrack}
spring.datasource.password=${DATABASE_PASSWORD:nexustrack}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
